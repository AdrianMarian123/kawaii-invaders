# Publica jocul pe GitHub Pages. "enablement: true" ii spune lui GitHub
# sa activeze singur Pages, ca sa nu fie nevoie de nicio setare manuala.
name: Publica jocul pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ia fisierele din repo
        uses: actions/checkout@v4

      - name: Instaleaza Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instaleaza dependintele
        run: npm ci

      - name: Construieste jocul (Vite)
        run: npm run build

      - name: Activeaza si configureaza Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Impacheteaza folderul construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
